name: Code Scan Cron

on:
  schedule:
    - cron: '0 0 * * SUN'

jobs:
  code-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: smallstep/workflows/.github/workflows/code-scan.yml@main
    secrets: inherit
    with:
      codeql-build-mode: manual # tell codeql we'll build; skips autobuild's Makefile heuristic
      codeql-build-cmd: go build ./...
